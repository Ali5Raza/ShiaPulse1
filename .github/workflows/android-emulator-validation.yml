name: Android emulator validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-one-instrumentation:
    name: Phase 1 tests on Android 15 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Quran data integrity
        run: python3 scripts/validate_quran_data.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Non-secret placeholders are sufficient for compilation and offline UI tests.
      - name: Create CI-only local configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "shiapulse-ci-placeholder",
              "storage_bucket": "shiapulse-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mojedarya.shiapulse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-Placeholder-Not-A-Real-Secret-000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Debug,O=ShiaPulse,C=US" \
            -noprompt

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
            status=$?
            adb logcat -d -v threadtime > emulator-logcat.txt || true
            exit $status

      - name: Print failed instrumentation test details
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          result_root = Path("app/build/outputs/androidTest-results")
          reports = sorted(result_root.rglob("TEST-*.xml")) if result_root.exists() else []
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for detail in case.findall(kind):
                          failures.append((case.get("classname"), case.get("name"), kind, detail))
          if not failures:
              print("No failed instrumentation test cases found in the XML reports.")
          for class_name, test_name, kind, detail in failures:
              print(f"\n{kind.upper()}: {class_name} > {test_name}")
              print(detail.get("message", "No failure message"))
              if detail.text:
                  print(detail.text)
          PY

      - name: Upload emulator test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            emulator-logcat.txt
          if-no-files-found: ignore
